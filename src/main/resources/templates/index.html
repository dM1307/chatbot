<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${appName}">Local Chatbot</title>
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
<main class="container">
    <h1 th:text="${appName}">Local Chatbot</h1>
    <p class="subtitle">Private, local, and zero API cost with Ollama llama3.</p>
    <div id="chat" class="chat"></div>
    <form id="chat-form">
        <textarea id="message" rows="3" placeholder="Ask anything..."></textarea>
        <button type="submit">Send</button>
    </form>
    <p id="status"></p>
</main>
<script src="/app.js"></script>
</body>
</html>
